<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password Admin — YanStore</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b18;color:#f4f6ff;font-family:system-ui,Arial,sans-serif;padding:20px}.card{width:min(440px,100%);background:#141b2c;border:1px solid #334155;border-radius:18px;padding:28px;box-shadow:0 16px 40px #0005}h1{font-size:25px;margin:0 0 12px}p{color:#cbd5e1;line-height:1.5}label{display:block;margin:14px 0 6px}input,button{width:100%;border-radius:10px;padding:13px;font-size:16px}input{background:#0b1220;color:white;border:1px solid #64748b}button{background:#16a34a;color:white;border:0;font-weight:700;cursor:pointer;margin-top:18px}button:disabled{opacity:.5}a{color:#67e8f9}#msg{min-height:24px}</style></head>
<body><main class="card"><h1>🔐 Reset Password YanStore</h1><p id="intro">Memeriksa tautan pemulihan dari email...</p>
<form id="form" hidden><label for="pass">Password baru (minimal 8 karakter)</label><input id="pass" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirm">Ulangi password baru</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required>
<button id="save" type="submit">Simpan Password Baru</button></form>
<p id="msg" role="status"></p><p><a href="/">← Kembali ke YanStore</a></p></main>
<script>
const URL_SUPA='https://ivnohbhlahevaihunmbp.supabase.co';
const KEY='sb_publishable_uyzGj6RZJfhDdGqf2rAldg_NRQTNEZH';
const intro=document.getElementById('intro'),form=document.getElementById('form'),msg=document.getElementById('msg');
let token='';
function params(str){return new URLSearchParams(str.replace(/^#/,'').replace(/^\?/,'').replace(/^[^?]*\?/,'').replace(/^&/,''))}
async function init(){
 const hash=params(location.hash),query=params(location.search);
 const err=hash.get('error_description')||query.get('error_description');
 if(err){intro.textContent='Link pemulihan tidak berlaku.';msg.textContent=err;return;}
 token=hash.get('access_token')||'';
 if(!token&&query.get('token_hash')&&query.get('type')==='recovery'){
   try{
    const r=await fetch(URL_SUPA+'/auth/v1/verify',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token_hash:query.get('token_hash'),type:'recovery'})});
    const data=await r.json();if(!r.ok)throw Error(data.msg||data.message||'Tautan tidak valid');
    token=data.access_token||'';
   }catch(e){msg.textContent=e.message;return;}
 }
 if(!token){intro.textContent='Buka halaman ini melalui link reset password yang dikirim ke email admin.';return;}
 try{
  const r=await fetch(URL_SUPA+'/auth/v1/user',{headers:{apikey:KEY,Authorization:'Bearer '+token}});
  if(!r.ok)throw Error('Link kedaluwarsa atau tidak valid. Minta link baru dari halaman admin.');
  const user=await r.json();
  if((user.email||'').toLowerCase()!=='yanstore2023@gmail.com')throw Error('Link ini bukan untuk akun admin YanStore.');
  history.replaceState(null,'',location.pathname);
  intro.textContent='Buat password baru untuk akun admin YanStore.';form.hidden=false;
 }catch(e){intro.textContent='Tidak dapat memverifikasi tautan.';msg.textContent=e.message;}
}
form.addEventListener('submit',async e=>{
 e.preventDefault();const pass=document.getElementById('pass').value,confirm=document.getElementById('confirm').value,save=document.getElementById('save');
 if(pass.length<8){msg.textContent='Password minimal 8 karakter.';return;}
 if(pass!==confirm){msg.textContent='Konfirmasi password tidak sama.';return;}
 save.disabled=true;msg.textContent='Menyimpan password...';
 try{
  const r=await fetch(URL_SUPA+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:pass})});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Error(data.msg||data.message||data.error_description||'Gagal menyimpan password');
  token='';localStorage.removeItem('yanstore_v6_session');form.hidden=true;intro.textContent='✅ Password admin berhasil diubah. Silakan login kembali dari halaman utama YanStore.';msg.textContent='';
 }catch(e){msg.textContent='Gagal: '+e.message;}finally{save.disabled=false;}
});
init();
</script></body></html>
